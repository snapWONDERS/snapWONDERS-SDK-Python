name: CI

# Runs on the standalone snapWONDERS-SDK-Python repo (this file becomes .github/workflows/ci.yml
# there after `git subtree split`). Offline tests need no API key; the integration job only
# runs when SNAPWONDERS_TEST_API_KEY is configured as a repository secret.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Offline test suite
        run: pytest -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
